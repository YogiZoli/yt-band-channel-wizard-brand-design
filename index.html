<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brand Channel Wizard</title>
<meta name="description" content="Set up a YouTube Brand Channel for your course in 5 phases. Answer a few questions and get ready texts, a research prompt, image prompts and a click by click checklist.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;700&display=swap">
<style>
  /* Brand tokens: "Shine" palette, copied from the design-system canon (tokens.css, v3).
     Body size follows the live apps (16px). Components read role tokens only. */
  :root{
    --primary-50:#FFE9EF; --primary-500:#E42256; --primary-600:#D91E50; --primary-700:#B3163F; --primary-800:#A3143A;
    --live-50:#E3F7F6; --live-500:#00B1B0; --live-700:#00807F; --live-800:#006564;
    --coral:#FF8370; --freesia:#FEC84D;
    --ink:#0E1330; --ink-2:#2A3048; --label:#4A5068; --muted-text:#666C84;
    --border-strong-c:#D5D8E3; --border-c:#E6E8F0; --surface-alt-c:#F0F1F6; --ground:#F7F8FB; --white:#FFFFFF;
    --neutral-400:#9A9FB3;
    --success:#0B7A3E; --success-surface:#E3F3E8;
    --danger-text:#A33A00; --danger-surface:#FFF1E8; --danger-border:rgba(242,101,27,.4);

    --background:var(--ground); --foreground:var(--ink);
    --surface:var(--white); --surface-alt:var(--surface-alt-c); --muted-foreground:var(--muted-text);
    --primary:var(--primary-600); --primary-hover:var(--primary-700); --primary-foreground:#FFFFFF;
    --primary-surface:var(--primary-50); --primary-surface-foreground:var(--primary-800);
    --secondary:var(--ink); --secondary-hover:#1E2446; --secondary-foreground:#FFFFFF;
    --link:var(--live-700); --link-hover:var(--live-800); --live:var(--live-500);
    --border:var(--border-c); --border-strong:var(--border-strong-c); --input:var(--border-strong-c);
    --ring:rgba(217,30,80,.2); --ring-solid:var(--primary-600);

    --font-sans:"Open Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --font-mono:"Geist Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,monospace;
    --text-xs:.8125rem; --text-sm:.9375rem; --text-base:1rem; --text-lg:1.125rem;
    --radius-sm:6px; --radius-md:10px; --radius-lg:12px; --radius-xl:18px; --radius-full:9999px;
    --shadow-xs:0 1px 2px rgba(14,19,48,.06);
    --shadow-sm:0 1px 3px rgba(14,19,48,.08),0 1px 2px rgba(14,19,48,.04);
    --shadow-md:0 4px 12px rgba(14,19,48,.08);
    --duration-fast:120ms; --duration-base:180ms;
    --ease-standard:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(0,0,.2,1); --ease-inout:cubic-bezier(.4,0,.2,1);
    --dot-grid:radial-gradient(rgba(14,19,48,.07) 1px,transparent 1px); --dot-grid-size:20px;
    --hero-glow:radial-gradient(520px 260px at 100% 0%,rgba(255,131,112,.22),transparent 70%),
                radial-gradient(360px 200px at 0% 100%,rgba(254,200,77,.22),transparent 70%);
    --hairline:linear-gradient(90deg,var(--primary-600),var(--live-500));
    color-scheme:light;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{
    margin:0;color:var(--foreground);
    background:var(--dot-grid) 0 0/var(--dot-grid-size) var(--dot-grid-size) var(--background);
    font-family:var(--font-sans);font-size:var(--text-base);line-height:1.6;
    padding-inline:16px;padding-block:18px 40px;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  }
  body::before{content:"";position:fixed;inset:0 0 auto 0;height:2px;background:var(--hairline);z-index:5}
  .wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  header{text-align:center}
  h1{margin:0;font-weight:800;letter-spacing:-.016em;line-height:1.2;font-size:clamp(24px,6vw,30px);text-wrap:balance}
  .sub{margin:4px 0 0;font-size:var(--text-sm);font-weight:400;color:var(--muted-foreground)}

  /* progress: mono eyebrows, live blue-green bar */
  .prog{display:flex;flex-direction:column;gap:6px}
  .progtop{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--label)}
  .bar{height:6px;border-radius:var(--radius-full);background:var(--surface-alt);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--live);border-radius:var(--radius-full);transition:width var(--duration-base) var(--ease-standard)}

  /* the question: hero card with the faint glow */
  .band{background:var(--hero-glow),var(--surface);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius-xl);padding:20px;box-shadow:var(--shadow-xs);animation:card-in var(--duration-base) var(--ease-out)}
  @keyframes card-in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .steptag{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--label)}
  .steptag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live)}
  .steptag .n{order:2;min-width:20px;height:20px;padding:0 6px;border-radius:var(--radius-full);display:grid;place-items:center;background:var(--primary-surface);color:var(--primary-surface-foreground);font-size:12px;line-height:1;font-weight:700}
  .band h2{margin:10px 0 0;font-size:clamp(22px,5.6vw,28px);font-weight:800;letter-spacing:-.016em;line-height:1.2;text-wrap:balance}
  .why{margin:8px 0 0;font-size:var(--text-sm);font-weight:400;line-height:1.5;color:var(--muted-foreground)}

  /* card */
  .card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-xs);padding:20px;display:flex;flex-direction:column;gap:12px}
  .card.hl{border-color:var(--primary);box-shadow:var(--shadow-md);border-radius:var(--radius-xl)}
  .card .card{padding:16px}
  .card h3{margin:0;font-size:18px;font-weight:700;line-height:1.3}
  .card p{margin:0}
  .flabel{font-size:var(--text-sm);font-weight:600;margin:0;color:var(--label)}
  .hint{margin:0;font-size:var(--text-sm);font-weight:400;color:var(--muted-foreground);line-height:1.5}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .two{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:621px){.two{grid-template-columns:1fr 1fr}}
  input[type=text],input[type=email],input[type=url],textarea{
    width:100%;min-height:48px;border:1px solid var(--input);background:var(--surface);color:var(--foreground);border-radius:var(--radius-md);
    padding:12px 16px;font-family:inherit;font-size:16px;font-weight:400;
    transition:border-color var(--duration-base) var(--ease-standard),box-shadow var(--duration-base) var(--ease-standard);
  }
  input::placeholder,textarea::placeholder{color:var(--neutral-400)}
  textarea{min-height:104px;resize:vertical;line-height:1.5}
  textarea.tall{min-height:240px;font-family:var(--font-mono);font-size:13px}
  input:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}
  input[type=color]{width:54px;height:48px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--surface);padding:3px;cursor:pointer}
  input[type=file]{font-family:inherit;font-size:var(--text-sm);max-width:100%}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    appearance:none;cursor:pointer;text-align:left;width:100%;border:1px solid var(--border-strong);background:var(--surface);color:var(--foreground);
    border-radius:var(--radius-md);padding:13px 16px;font-family:inherit;font-size:16px;font-weight:600;line-height:1.35;
    display:flex;flex-direction:column;gap:2px;min-height:52px;justify-content:center;
    transition:background-color var(--duration-base) var(--ease-standard),border-color var(--duration-base) var(--ease-standard),transform var(--duration-fast) var(--ease-standard);
  }
  .opt small{font-size:var(--text-xs);font-weight:400;color:var(--muted-foreground)}
  .opt:hover{background:var(--surface-alt);border-color:var(--neutral-400)}
  .opt:active{transform:scale(.98)}
  .opt:focus-visible{outline:2px solid var(--ring-solid);outline-offset:2px}
  .opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-surface);color:var(--primary-surface-foreground);box-shadow:0 0 0 3px var(--ring)}

  /* buttons: one solid fuchsia action per screen, the rest ink or outline */
  .btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;border-radius:var(--radius-md);border:1px solid transparent;
    background:var(--primary);color:var(--primary-foreground);cursor:pointer;font-family:inherit;font-size:16px;font-weight:600;line-height:1.15;text-decoration:none;box-shadow:var(--shadow-sm);
    transition:background-color var(--duration-base) var(--ease-standard),box-shadow var(--duration-base) var(--ease-standard),transform var(--duration-fast) var(--ease-standard)}
  .btn:hover{background:var(--primary-hover);box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--ring-solid);outline-offset:2px}
  .btn.ghost{background:var(--surface);color:var(--foreground);border-color:var(--border-strong);box-shadow:none}
  .btn.ghost:hover{background:var(--surface-alt);border-color:var(--neutral-400);transform:none}
  .btn.small{font-size:var(--text-xs);font-weight:700;padding:8px 14px;min-height:36px;background:var(--secondary);color:var(--secondary-foreground)}
  .btn.small:hover{background:var(--secondary-hover);transform:none}
  .btn.small.ghost{background:var(--surface);color:var(--foreground)}
  .btn.small.ghost:hover{background:var(--surface-alt)}
  .btn[disabled]{opacity:.5;cursor:default;animation:none}
  /* the screen's main action: pulsing halo and a light sheen */
  #next,#gotit,#pdfBtn,form .btn[type=submit]{position:relative;overflow:hidden;animation:cta-halo 2.4s var(--ease-out) infinite}
  #next::after,#gotit::after,#pdfBtn::after,form .btn[type=submit]::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 3.2s var(--ease-inout) infinite;pointer-events:none}
  @keyframes cta-halo{0%{box-shadow:0 0 0 0 rgba(228,34,86,.5),0 6px 20px rgba(255,131,112,.35)}70%{box-shadow:0 0 0 14px transparent,0 6px 20px rgba(255,131,112,.35)}100%{box-shadow:0 0 0 0 transparent,0 6px 20px rgba(255,131,112,.35)}}
  @keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
  .nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .nav .grow{flex:1}
  .formerr{color:var(--danger-text);background:var(--danger-surface);border:1px solid var(--danger-border);border-radius:var(--radius-lg);padding:10px 14px;font-size:var(--text-sm);font-weight:600;margin:0}

  .steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
  .steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:var(--text-sm);line-height:1.5}
  .steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--primary-surface);color:var(--primary-surface-foreground);display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;font-weight:700}
  a{color:var(--link);font-family:var(--font-mono);font-size:.94em;text-decoration:none}
  a:hover{color:var(--link-hover);text-decoration:underline;text-underline-offset:2px}
  a.btn{font-family:inherit;font-size:16px;color:var(--primary-foreground)}
  a.btn.ghost{color:var(--foreground)}
  a.btn:hover{text-decoration:none}
  code,.path{font-family:var(--font-mono);font-size:13px;background:var(--surface-alt);border-radius:var(--radius-sm);padding:2px 6px;overflow-wrap:anywhere;color:var(--ink-2)}

  /* underline tabs */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border)}
  .tab{appearance:none;cursor:pointer;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted-foreground);padding:10px 4px;font-family:inherit;font-size:var(--text-sm);font-weight:600;line-height:1.2;min-height:44px}
  .tab:hover{color:var(--foreground)}
  .tab[aria-current="true"]{border-bottom-color:var(--primary);color:var(--foreground);font-weight:700}
  .tab:focus-visible{outline:2px solid var(--ring-solid);outline-offset:-2px}

  .sechead{margin:10px 0 0;display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--label)}
  .sechead::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live);flex:none}
  .blockhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .out{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-alt);border-radius:var(--radius-md);padding:12px 14px;font-family:inherit;font-size:var(--text-sm);line-height:1.55;max-height:340px;overflow:auto}
  .out.mono{font-family:var(--font-mono);font-size:13px}

  .phase{display:flex;flex-direction:column;gap:10px}
  .phase + .phase{border-top:1px solid var(--border);padding-top:14px}
  .phase h4{margin:0;font-size:16px;font-weight:700}
  .chk{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:var(--text-sm);line-height:1.5;cursor:pointer}
  .chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--primary)}
  .chk .p{display:block;margin-top:4px;font-size:var(--text-xs);color:var(--muted-foreground)}

  /* uploads */
  .drop{border:1px dashed var(--border-strong);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--background)}
  .logos{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .logos figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:var(--text-xs);color:var(--muted-foreground)}
  .logos img{border-radius:50%;object-fit:cover;background:var(--surface);border:1px solid var(--border)}
  .banner{position:relative;width:100%;aspect-ratio:2560/1440;border-radius:var(--radius-md);overflow:hidden;background:var(--surface-alt)}
  .banner img{width:100%;height:100%;object-fit:cover;display:block}
  .banner .desk{position:absolute;left:0;right:0;top:35.3125%;height:29.375%;border-block:2px dashed rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(14,19,48,.4)}
  .banner .safe{position:absolute;left:19.8047%;width:60.3906%;top:35.3125%;height:29.375%;border:3px solid var(--live);box-shadow:0 0 0 2000px rgba(14,19,48,.45)}
  .banner .safe span{position:absolute;left:0;top:-23px;background:var(--secondary);color:var(--secondary-foreground);font-family:var(--font-mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:var(--radius-sm);white-space:nowrap}
  .found{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;font-weight:700;border-radius:var(--radius-full);padding:4px 10px;color:var(--label);background:var(--surface-alt)}
  .chip.ok{background:var(--success-surface);color:var(--success)}

  .cta{font-size:16px;font-weight:600;line-height:1.5;margin:0}
  footer{color:var(--muted-foreground);font-size:var(--text-xs);line-height:1.55;text-align:center}

  /* rendered research: used on screen and in the PDF host */
  .md h4{margin:0 0 6px;font-size:16px;font-weight:700}
  .md p{margin:0 0 6px;font-size:var(--text-sm);line-height:1.5}
  .md ul{margin:0 0 6px;padding-left:19px;font-size:var(--text-sm)}
  .md .tw{overflow-x:auto}
  .md table{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.4;margin:0 0 6px}
  .md th,.md td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
  .md th{background:var(--surface-alt);font-weight:700;color:var(--label)}

  .pdfhost{position:fixed;left:-12000px;top:0;width:760px;background:var(--white);color:var(--ink);font-family:var(--font-sans);font-size:13px;line-height:1.5}
  .pdfhost .b{padding:0 0 12px;background:var(--white)}
  .pdfhost .hero{position:relative;overflow:hidden;background:var(--hero-glow),var(--ground);border:1px solid var(--border);border-radius:var(--radius-xl);padding:24px}
  .pdfhost .hero::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--hairline)}
  .pdfhost .hero .k{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:1px;color:var(--label)}
  .pdfhost .hero .t{font-size:28px;font-weight:800;line-height:1.15;margin:6px 0;color:var(--ink)}
  .pdfhost .hero .m{font-size:13px;color:var(--muted-text)}
  .pdfhost .sh{font-size:18px;font-weight:700;padding:8px 0 6px;color:var(--ink);background:var(--hairline) left bottom/100% 2px no-repeat}
  .pdfhost .lab{font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--label);margin-bottom:4px}
  .pdfhost .tx{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-alt-c);border-radius:var(--radius-md);padding:10px 12px;font-size:12.5px}
  .pdfhost .md .tw{overflow:visible}
  .pdfhost .ci{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:12px;margin-bottom:6px}
  .pdfhost .ci i{width:12px;height:12px;border:1.5px solid var(--border-strong-c);border-radius:3px;margin-top:3px;display:block}
  .pdfhost .ci i.d{background:var(--success);border-color:var(--success)}
  .pdfhost .ci span{color:var(--muted-text);display:block;font-family:var(--font-mono);font-size:10.5px}
  .pdfhost .imgs{display:flex;gap:16px;align-items:center}
  .pdfhost .imgs img.l{width:120px;height:120px;border-radius:50%;object-fit:cover}
  .pdfhost .imgs img.bn{width:100%;border-radius:var(--radius-md);display:block}
  .pdfhost .ctab{background:var(--primary-600);color:#FFFFFF;border-radius:var(--radius-lg);padding:18px 20px;font-size:15px;font-weight:700}
  .pdfhost .ctab div{font-family:var(--font-mono);font-size:12px;font-weight:400;margin-top:6px}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Brand Channel Wizard</h1>
    <p class="sub">Your YouTube channel for your course, set up right in 5 phases</p>
  </header>
  <div class="prog" id="prog">
    <div class="progtop"><span id="progL"></span><span id="progR"></span></div>
    <div class="bar"><i id="progBar" style="width:0%"></i></div>
  </div>
  <main id="stage" class="wrap"></main>
  <footer>
    Everything runs in your browser. Your images never leave your device.
  </footer>
</div>
<div class="pdfhost" id="pdfhost" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ===== SETTINGS: the two things to edit ===== */
var WEBHOOK_URL = "";   // GHL inbound webhook. Empty = no POST, the kit is still delivered.
var PROGRAM_URL = "https://example.com/6-pillar-cohort";   // placeholder: the 6-pillar cohort program page
/* ============================================ */

(function(){
  var $ = function(id){ return document.getElementById(id); };
  var SOURCE = "brand-channel-wizard";
  var VIDIQ_SIGNUP = "https://vidiq.com/";
  var VIDIQ_MCP_GUIDE = "https://vidiq.com/mcp/";
  var VIDIQ_MCP_URL = "https://mcp.vidiq.com/mcp";
  var CTA_LINE = "Next step: build this channel with a group in my 6-pillar cohort program.";
  var CARD_TITLE = "YouTube Evergreen Organic Traffic Card";
  var FILE_BASE = "youtube-evergreen-organic-traffic-card";

  var PHASES = [
    "Account and profile",
    "Brand Channel, handle, verification",
    "Identity and keyword research",
    "Channel customization",
    "Studio defaults and community moderation"
  ];

  /* One question per screen. Each one says why it asks. */
  var QUESTIONS = [
    { id:"who", phase:1, type:"text", key:"who",
      title:"Who do you help?",
      why:"I ask because a channel for everyone gets found by no one. One clear group makes every later step easier.",
      label:"Finish the sentence: I help ...", ph:"busy yoga teachers" },
    { id:"result", phase:1, type:"text", key:"result",
      title:"What do you help them do?",
      why:"I ask because people search for a result, not for a course. This becomes your tagline.",
      label:"Finish the sentence: I help them ...", ph:"fill their classes without paid ads" },
    { id:"topic", phase:1, type:"text", key:"topic",
      title:"What is your course about, in two or three words?",
      why:"I ask because YouTube needs a plain topic to file your channel under.",
      label:"Your topic", ph:"yoga studio marketing" },
    { id:"face", phase:1, type:"face",
      title:"Is the channel you, or a brand?",

  function mdBlocks(text, rowsPer){

    rowsPer = rowsPer || 1000;
    while(i < L.length){
      var ln = L[i];
      if(!ln.trim()){ i++; continue; }
      if(/^\s*\|/.test(ln)){
        var rows = [];
        while(i < L.length && /^\s*\|/.test(L[i])){
          if(!/^[\s|:\-]+$/.test(L[i])) rows.push(cells(L[i]));
          i++;
        }
        var head = rows.shift() || [];
        var th = "<tr>" + head.map(function(c){ return "<th>" + inline(c) + "</th>"; }).join("") + "</tr>";
        if(!rows.length) rows = [[]];
        for(var r = 0; r < rows.length; r += rowsPer){
          out.push("<div class='tw'><table>" + th + rows.slice(r, r + rowsPer).map(function(row){
            return "<tr>" + head.map(function(_, ci){ return "<td>" + inline(row[ci] || "") + "</td>"; }).join("") + "</tr>";
          }).join("") + "</table></div>");
        }
        continue;
      }
      var hm = ln.match(/^\s*#{1,6}\s+(.*)$/);
      if(hm){ out.push("<h4>" + inline(hm[1]) + "</h4>"); i++; continue; }
      if(/^\s*([-*]|\d+[.)])\s+/.test(ln)){
        var items = [];
        while(i < L.length && /^\s*([-*]|\d+[.)])\s+/.test(L[i])){ items.push("<li>" + inline(L[i].replace(/^\s*([-*]|\d+[.)])\s+/, "")) + "</li>"); i++; }
        for(var q = 0; q < items.length; q += 18) out.push("<ul>" + items.slice(q, q + 18).join("") + "</ul>");

      out.push("<p>" + para.join("<br>") + "</p>");
    }
    return out;
  }

  /* ---------- PDF: each block is drawn with html2canvas and placed on A4 pages by jsPDF ---------- */
  function buildPdf(onStep){
    var doc = new window.jspdf.jsPDF({ unit:"pt", format:"a4" });
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    var M = 36, CW = W - M*2, TOP = 36, BOT = H - 46, y = TOP;
    var host = $("pdfhost"), blocks = cardBlocks(), i = 0;
    host.innerHTML = "";

    function place(cv, b, nextKeep){
      var hPt = cv.height / cv.width * CW, fmt = b.img ? "JPEG" : "PNG";
      var url = function(c){ return b.img ? c.toDataURL("image/jpeg", 0.9) : c.toDataURL("image/png"); };
      if(hPt <= BOT - TOP){
        /* a section heading never stays alone at the bottom of a page */
        if(y + hPt + (b.keep ? 60 : 0) > BOT){ doc.addPage(); y = TOP; }
        doc.addImage(url(cv), fmt, M, y, CW, hPt, undefined, "FAST");
        if(b.link) doc.link(M, y, CW, hPt, { url:b.link });
        y += hPt;
        return;
      }
      /* taller than a page: cut it into page-high slices */
      var off = 0;
      while(off < cv.height){
        var room = BOT - y;
        if(room < 120){ doc.addPage(); y = TOP; room = BOT - TOP; }
        var sh = Math.min(cv.height - off, Math.floor(room * cv.width / CW));
        var c = document.createElement("canvas"); c.width = cv.width; c.height = sh;
        var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, sh);
        x.drawImage(cv, 0, off, cv.width, sh, 0, 0, cv.width, sh);
        doc.addImage(url(c), fmt, M, y, CW, sh / cv.width * CW, undefined, "FAST");
        y += sh / cv.width * CW; off += sh;
      }
    }
    function next(){
      if(i >= blocks.length){
        host.innerHTML = "";
        var n = doc.internal.getNumberOfPages();
        for(var p = 1; p <= n; p++){
          doc.setPage(p); doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(102, 108, 132);
          doc.text(CARD_TITLE, M, H - 24);
          doc.text("Page " + p + " of " + n, W - M, H - 24, { align:"right" });
        }
        return doc;
      }
      var b = blocks[i++], el = document.createElement("div");
      el.className = "b"; el.innerHTML = b.h; host.appendChild(el);
      if(onStep) onStep(i, blocks.length);
      return window.html2canvas(el, { scale:2, backgroundColor:"#ffffff", logging:false, useCORS:true }).then(function(cv){
        host.removeChild(el);
        place(cv, b);
        return next();
      });
    }
    return Promise.resolve().then(next);
  }

  function download(name, blob){
    var u = URL.createObjectURL(blob), aEl = document.createElement("a");
    aEl.href = u; aEl.download = name; document.body.appendChild(aEl); aEl.click();

  /* ---------- lead capture ---------- */
  function sendLead(payload){
    if(!WEBHOOK_URL) return;
    try{
      fetch(WEBHOOK_URL, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload), keepalive:true
      }).catch(function(){
        /* If the browser blocks the JSON request (CORS), resend as a plain form post. */
        var flat = new URLSearchParams();
        flat.append("name", payload.name);
        flat.append("email", payload.email);
        flat.append("source", payload.source);
        flat.append("ai_app", payload.ai_app);
        Object.keys(payload.answers).forEach(function(k){ flat.append(k, String(payload.answers[k])); });
        return fetch(WEBHOOK_URL, { method:"POST", mode:"no-cors", body:flat, keepalive:true });
      }).catch(function(){});
    }catch(e){}
  }

  function copyText(text, btn){
    function done(){ var t = btn.textContent; btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = t; }, 1400); }
    function fallback(){
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }

    h += "<p class='sechead'>D. Phase checklist</p><div class='card'>";
    cl.forEach(function(p, i){
      h += "<div class='phase'><h4>Phase " + (i+1) + ": " + esc(p.name) + "</h4>" + p.items.map(function(it){
        return "<label class='chk'><input type='checkbox' data-chk='" + it[0] + "'" + (S.checks[it[0]] ? " checked" : "") + "><span>" + esc(it[1]) + "<span class='p'><span class='path'>" + esc(it[2]) + "</span></span></span></label>";
      }).join("") + "</div>";
    });
    h += "<p class='hint'>" + esc(PATH_NOTE) + "</p>";
    h += "<div class='nav'><span></span><button type='button' class='btn small ghost' data-copy='check'>Copy the checklist</button></div></div>";
    COPY.check = cl.map(function(p, i){ return "Phase " + (i+1) + ": " + p.name + "\n" + p.items.map(function(it){ return "[ ] " + it[1] + "\n    " + it[2]; }).join("\n"); }).join("\n\n");
    h += "<div class='nav'><button type='button' class='btn ghost' id='edit'>Change my answers</button><button type='button' class='btn' id='next'>Next: paste your research back</button></div>";
    stage.innerHTML = h;
    bindTabs(); bindCopy();
    Array.prototype.forEach.call(stage.querySelectorAll("[data-chk]"), function(c){ c.addEventListener("change", function(){ S.checks[this.dataset.chk] = this.checked; save(); }); });
    $("edit").addEventListener("click", function(){ go(Q_FIRST); });
    $("next").addEventListener("click", function(){ go(S.i + 1); });
  }

  function foundHtml(){
    var R = parseResearch(S.research);
    return SECTIONS.map(function(s){ return "<span class='chip" + (R[s[0]] ? " ok" : "") + "'>" + s[1] + (R[s[0]] ? ": found" : ": missing") + "</span>"; }).join("");
  }
  function readImage(file, kind, cb){
    if(!file || !/^image\//.test(file.type)) return;
    var fr = new FileReader();
    fr.onload = function(){ var im = new Image(); im.onload = function(){ IMG[kind] = fr.result; IMG[kind + "Size"] = im.naturalWidth + " x " + im.naturalHeight; cb(); }; im.src = fr.result; };
    fr.readAsDataURL(file);
  }
  function previews(){
    var l = $("logoPrev"), b = $("bannerPrev");
    l.innerHTML = IMG.logo ? "<div class='logos'>" + [[120,"Channel page"],[48,"Under videos"],[24,"Comments"]].map(function(s){
      return "<figure><img src='" + IMG.logo + "' width='" + s[0] + "' height='" + s[0] + "' alt='Logo preview'>" + s[1] + "</figure>"; }).join("") + "</div>" +
      "<p class='hint'>Your file is " + IMG.logoSize + (IMG.logoSize === "800 x 800" ? ". Right size." : ". YouTube wants 800 x 800, square.") + " Can you still read it in the smallest circle?</p>" : "";
    b.innerHTML = IMG.banner ? "<div class='banner'><img src='" + IMG.banner + "' alt='Banner preview'><div class='desk' id='deskO'></div><div class='safe' id='safeO'><span>Safe area 1546 x 423</span></div></div>" +
      "<label class='chk'><input type='checkbox' id='ovl' checked><span>Show the safe area<span class='p'>Green box: what phones show. Dashed strip: what desktop shows. Everything darkened only appears on TVs.</span></span></label>" +
      "<p class='hint'>Your file is " + IMG.bannerSize + (IMG.bannerSize === "2560 x 1440" ? ". Right size." : ". YouTube wants 2560 x 1440.") + " All text and the logo must sit inside the green box.</p>" : "";
    var o = $("ovl"); if(o) o.addEventListener("change", function(){ $("safeO").hidden = !this.checked; $("deskO").hidden = !this.checked; });
  }
  function paste(){
    stage.innerHTML = tabs() +
      "<div class='card'><h3>Paste your research from " + appName() + "</h3><p class='hint'>Copy the whole answer from " + appName() + " and paste it here, tables and all. It stays in this browser.</p>" +
      "<textarea class='tall' id='research' placeholder='## Seeds&#10;| # | Seed | Why this seed |&#10;...'>" + esc(S.research) + "</textarea>" +
      "<div class='found' id='found'>" + foundHtml() + "</div>" +
      "<p class='hint'>A section shows as missing when its heading is not in the text. You can still download the card and add it later.</p></div>" +
      "<div class='card'><h3>Add your logo and banner (optional)</h3><p class='hint'>Made them with the image prompts? Check them here before you upload to YouTube. The files are read by your browser only. They are never stored and never sent anywhere.</p>" +
      "<div class='drop'><label class='flabel' for='logoFile'>Logo or profile picture</label><input type='file' id='logoFile' accept='image/*'><div id='logoPrev'></div></div>" +
      "<div class='drop'><label class='flabel' for='bannerFile'>Banner</label><input type='file' id='bannerFile' accept='image/*'><div id='bannerPrev'></div></div></div>" +
      "<div class='nav'><button type='button' class='btn ghost' id='back'>Back to the kit</button><button type='button' class='btn' id='next'>Next: build my card</button></div>";
    bindTabs(); previews();
    $("research").addEventListener("input", function(){ S.research = this.value; save(); $("found").innerHTML = foundHtml(); });
    $("logoFile").addEventListener("change", function(){ readImage(this.files[0], "logo", previews); });
    $("bannerFile").addEventListener("change", function(){ readImage(this.files[0], "banner", previews); });
    bindNav();
  }

  function card(){
    var has = !!S.research.trim();
    stage.innerHTML = tabs() +
      "<div class='card hl'><h3 id='qh' tabindex='-1'>Your " + CARD_TITLE + "</h3>" +
      "<p class='hint'>" + (has ? "Your texts, your research and your checklist in one place." : "You have not pasted any research yet, so those sections will be empty. You can still download the card now and come back later.") + "</p>" +
      "<div class='nav'><button type='button' class='btn' id='pdfBtn'>Download the PDF</button><button type='button' class='btn ghost' id='mdBtn'>Download the .md file</button></div>" +
      "<p class='hint' id='dlMsg' role='status'>The .md file has fixed headings, so other tools can read it later.</p></div>" +
      "<div class='card'><p class='cta'>" + esc(CTA_LINE) + " <a id='programLink' href='" + esc(PROGRAM_URL) + "' target='_blank' rel='noopener'>See the program</a></p></div>" +
      "<div class='card'><h3>Preview</h3><div class='md' id='preview'></div></div>" +
      "<div class='nav'><button type='button' class='btn ghost' id='back'>Back</button><button type='button' class='btn ghost' id='restart'>Start over</button></div>";
    bindTabs(); bindNav();
    var R = parseResearch(S.research), prev = "<h4>Channel</h4><p><b>" + esc(nameOptions()[0]) + "</b> " + esc(handleOptions()[0] || "") + "<br>" + esc(taglines()[0]) + "</p>";
    SECTIONS.forEach(function(s){ prev += "<h4>" + s[1] + "</h4>" + (R[s[0]] ? mdBlocks(R[s[0]]).join("") : "<p class='hint'>Not pasted yet.</p>"); });
    $("preview").innerHTML = prev;
    $("mdBtn").addEventListener("click", function(){
      download(FILE_BASE + ".md", new Blob([buildMarkdown()], { type:"text/markdown;charset=utf-8" }));
      $("dlMsg").textContent = "Check your downloads for the .md file.";
    });
    $("pdfBtn").addEventListener("click", function(){
      var btn = this, msg = $("dlMsg");
      if(!window.jspdf || !window.jspdf.jsPDF || !window.html2canvas){ msg.textContent = "The PDF tool did not load. Check your connection, reload the page and try again."; return; }
      btn.disabled = true; msg.textContent = "Building your PDF.";
      buildPdf(function(i, n){ msg.textContent = "Building your PDF, part " + i + " of " + n + "."; }).then(function(doc){
        doc.save(FILE_BASE + ".pdf");
        msg.textContent = "Check your downloads for the PDF.";
      }).catch(function(){
        msg.textContent = "The PDF could not be created. Reload the page and try again. The .md file still works.";
      }).then(function(){ btn.disabled = false; });
    });
    $("restart").addEventListener("click", function(){
      if(!window.confirm("Clear all your answers and start again?")) return;
      try{ localStorage.removeItem("bcw_bd_state"); }catch(e){}
      location.reload();
    });
  }

  load();
  render();
})();
</script>
</body>
</html>
